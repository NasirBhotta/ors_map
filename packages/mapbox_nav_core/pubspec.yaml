name: mapbox_nav_core
description: "An unofficial, decoupled navigation engine and Mapbox presentation layer for building Flutter turn-by-turn navigation."
version: 0.1.0-beta.1
repository: https://github.com/NasirBhotta/ors_map/tree/main/packages/mapbox_nav_core
issue_tracker: https://github.com/NasirBhotta/ors_map/issues
topics:
  - navigation
  - mapbox
  - maps
  - turn-by-turn

environment:
  sdk: ^3.7.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  mapbox_maps_flutter: ^2.25.0
  http: ^1.6.0
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
